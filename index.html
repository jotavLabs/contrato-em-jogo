<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Game show de sala de aula sobre trabalho intermitente e temporário, para 2 a 4 times numa tela só.">
<title>Contrato em Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Palco de game show: raios girando ao fundo, placar dos times no topo, carta do desafio no centro do palco */
:root {
  --bg: #7ED6E6;
  --bg-ray: #A2E4EF;
  --on-bg: #221B3A;
  --paper: #FFFDF6;
  --paper-2: #EFE9D6;
  --ink: #221B3A;
  --ink-soft: #565072;
  --shadow: #221B3A;
  --scrim: rgba(24, 16, 52, .62);
  --on-strong: #FFFFFF;
  --sun: #FFC93C;
  --pop: #FF5D8F;
  --ok: #12985A;
  --ok-soft: #D9F5E6;
  --bad: #D93A2B;
  --bad-soft: #FFE0DB;
  --int: #7B4DFF;
  --int-ink: #FFFFFF;
  --tmp: #FF9A2E;
  --tmp-ink: #221B3A;
  --t0: #3FA7F5;
  --t1: #2EC27E;
  --t2: #FF5DA2;
  --t3: #FFD23F;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #221A48; --bg-ray: #2B2258; --on-bg: #FFF6DE; --paper: #FBF6E6; --paper-2: #E9E1C8;
    --shadow: #0C081F; --scrim: rgba(6, 3, 18, .72); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #221A48; --bg-ray: #2B2258; --on-bg: #FFF6DE; --paper: #FBF6E6; --paper-2: #E9E1C8;
  --shadow: #0C081F; --scrim: rgba(6, 3, 18, .72); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { font-size: clamp(15px, 0.9vw + 6px, 24px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--on-bg);
  font-family: var(--font-body);
  font-weight: 700;
  line-height: 1.35;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--pop); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mini-logo, .tagline, .vs, .chip-score, .floater, .how-num, .timer-num, .deal-text, .bin, .verdict-title, .verdict-gain,
.bar-pos, .bar-score, .pod-score, .pod-block, .overlay-title, .banner-name, .stamp, .seg-btn, .reg-btn { font-weight: 400; }

.rays {
  position: fixed; left: 50%; top: 58%;
  width: 230vmax; height: 230vmax;
  transform: translate(-50%, -50%);
  background: repeating-conic-gradient(from 0deg, var(--bg-ray) 0deg 8deg, transparent 8deg 16deg);
  animation: spin 160s linear infinite;
  pointer-events: none; z-index: 0;
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

.app {
  position: relative; z-index: 1;
  min-height: 100%;
  max-width: 1440px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 22px;
}

.outlined {
  color: var(--sun);
  text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
    2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 7px 0 var(--shadow);
}
.outlined-sm {
  color: var(--sun);
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink),
    1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 4px 0 var(--shadow);
}
.kicker {
  display: inline-block; margin: 0;
  font-size: .78rem; font-weight: 900; text-transform: uppercase; letter-spacing: .12em;
  color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 999px; padding: .3em .9em;
  box-shadow: 0 3px 0 var(--shadow);
}
.panel {
  color: var(--ink); background: var(--paper);
  border: 4px solid var(--ink); border-radius: 24px;
  box-shadow: 0 8px 0 var(--shadow);
  padding: clamp(16px, 2vw, 30px);
}
.panel-title { margin: 0 0 .8rem; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .6em;
  font-size: 1rem; font-weight: 900; line-height: 1.15; text-align: center;
  color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 14px; padding: .75em 1.2em;
  box-shadow: 0 5px 0 var(--shadow);
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 0 var(--shadow); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.btn-primary { background: var(--sun); }
.btn-danger { background: var(--bad); color: var(--on-strong); }
.btn-big { font-size: 1.2rem; padding: .8em 1.5em; }
.btn-key {
  font-size: .62em; font-weight: 900; text-transform: uppercase; letter-spacing: .08em;
  border: 2px solid currentColor; border-radius: 7px; padding: .1em .45em; opacity: .7;
}
.pill { display: inline-block; font-weight: 900; border: 2px solid var(--ink); border-radius: 999px; padding: .05em .65em; }
.pill-int { background: var(--int); color: var(--int-ink); }
.pill-tmp { background: var(--tmp); color: var(--tmp-ink); }
kbd {
  font-family: var(--font-body); font-weight: 900; font-size: .85em; color: var(--ink);
  background: var(--paper-2); border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 8px; padding: .05em .45em;
}

/* topo */
.topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
.mini-logo { font-family: var(--font-display); font-size: 1.35rem; line-height: 1; letter-spacing: .01em; }
.phase-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill-step {
  font-size: .78rem; font-weight: 900; padding: .4em .85em;
  color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 999px; opacity: .6;
}
.pill-step.done { opacity: .95; background: var(--ok-soft); }
.pill-step.now { opacity: 1; background: var(--sun); box-shadow: 0 3px 0 var(--shadow); }
.progress { font-weight: 900; font-size: .95rem; color: var(--on-bg); font-variant-numeric: tabular-nums; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.tool {
  font-size: .78rem; font-weight: 900; color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 12px; padding: .45em .8em; box-shadow: 0 3px 0 var(--shadow);
}
.tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.tool:disabled { opacity: .45; cursor: default; transform: none; }

/* placar */
.scorebar { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 12px; padding-top: .55rem; }
.chip {
  position: relative; display: flex; align-items: center; gap: .6rem; min-width: 0;
  padding: .5rem .8rem; color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--shadow);
  transition: transform .25s, box-shadow .25s;
}
.chip.active { transform: translateY(-4px); box-shadow: 0 8px 0 var(--shadow), 0 0 0 5px var(--team); }
.chip.bump { animation: bump .5s; }
.chip-dot { width: 1.5rem; height: 1.5rem; flex: none; border-radius: 50%; background: var(--team); border: 3px solid var(--ink); }
.chip-name { flex: 1; min-width: 0; font-weight: 900; font-size: 1rem; line-height: 1.15; overflow-wrap: anywhere; }
.chip-score { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.chip-tag {
  position: absolute; top: -.85rem; left: .7rem; display: none;
  font-size: .62rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); background: var(--team); border: 2px solid var(--ink); border-radius: 999px; padding: .1em .6em;
}
.chip.active .chip-tag { display: block; animation: pulse 1.1s ease-in-out infinite; }
.floater {
  position: absolute; left: 50%; top: -.4rem; pointer-events: none;
  font-family: var(--font-display); font-size: 1.7rem; color: var(--sun);
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 0 4px 0 var(--shadow);
  animation: floatUp 1.2s ease-out forwards;
}

.stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.stage > * { animation: enter .35s ease-out backwards; }

/* montagem */
.setup { display: grid; gap: clamp(16px, 2.4vw, 32px); align-content: start; padding-block: clamp(8px, 2vh, 28px); }
.hero { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: clamp(12px, 3vw, 40px); }
.hero-mascot .mascot { width: clamp(6.5rem, 13vw, 10.5rem); height: auto; display: block; animation: bob 2.6s ease-in-out infinite; }
.hero-text { display: grid; gap: .55rem; justify-items: start; min-width: 0; }
.logo { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.8rem, 7.5vw, 6.2rem); line-height: .95; letter-spacing: .01em; text-wrap: balance; }
.tagline { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; margin: 0; font-family: var(--font-display); font-size: clamp(1.2rem, 2.6vw, 2rem); }
.tag-int, .tag-tmp { border: 3px solid var(--ink); border-radius: 14px; padding: .1em .55em; box-shadow: 0 4px 0 var(--shadow); }
.tag-int { background: var(--int); color: var(--int-ink); transform: rotate(-2deg); }
.tag-tmp { background: var(--tmp); color: var(--tmp-ink); transform: rotate(2deg); }
.vs { font-size: 1.3em; line-height: 1; }
.setup-grid { width: 100%; max-width: 68rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(14px, 2vw, 24px); align-items: start; }
.setup-form { display: grid; gap: 1rem; }
.setup-form .panel-title { margin: 0; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.field-label { font-weight: 900; font-size: 1.05rem; }
.seg { display: flex; gap: .5rem; }
.seg-btn {
  width: 3rem; height: 3rem; font-family: var(--font-display); font-size: 1.45rem;
  color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--shadow);
}
.seg-btn[aria-pressed="true"] { background: var(--sun); transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.team-inputs { display: grid; gap: .6rem; }
.team-input {
  display: flex; align-items: center; gap: .6rem; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 14px; padding: .25rem .4rem .25rem .7rem;
}
.team-input:focus-within { box-shadow: 0 0 0 4px var(--pop); }
.team-input input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 1.1rem; font-weight: 800; padding: .55rem .3rem; }
.team-input input:focus { outline: none; }
.swatch { width: 1.6rem; height: 1.6rem; flex: none; border-radius: 50%; background: var(--team); border: 3px solid var(--ink); }
.how { display: grid; gap: .9rem; }
.how .panel-title { margin: 0; }
.how-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.how-steps li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .8rem; align-items: start; line-height: 1.4; }
.how-steps b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.how-num { width: 2.2rem; height: 2.2rem; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.15rem; background: var(--sun); border: 3px solid var(--ink); border-radius: 50%; }
.how-note { margin: 0; color: var(--ink-soft); line-height: 1.45; }
.keys { margin: 0; font-size: .9rem; color: var(--ink-soft); line-height: 2; }
.setup-tools { display: flex; flex-wrap: wrap; gap: .5rem; }

/* abertura de fase */
.intro { width: 100%; max-width: 66rem; margin: 0 auto; display: grid; gap: 1.2rem; }
.intro-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(12px, 2vw, 28px); align-items: center; }
.intro-mascot .mascot { width: clamp(5rem, 9vw, 8rem); height: auto; display: block; }
.intro-titles { display: grid; gap: .45rem; justify-items: start; }
.phase-badge { font-size: .78rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--paper); background: var(--ink); border-radius: 999px; padding: .3em .9em; }
.intro-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 4.5vw, 3.6rem); line-height: 1; }
.intro-lead { margin: 0; font-size: 1.12rem; line-height: 1.45; max-width: 62ch; }
.primer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.primer-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .35rem 1rem; align-items: center;
  border: 4px solid var(--ink); border-radius: 20px; padding: 1rem 1.2rem; box-shadow: 0 6px 0 var(--shadow);
}
.primer-card svg { grid-row: span 2; width: 3.8rem; height: 3.8rem; align-self: start; }
.primer-card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1; }
.primer-card p { margin: 0; font-size: 1rem; line-height: 1.42; }
.primer-card.int { background: var(--int); color: var(--int-ink); }
.primer-card.tmp { background: var(--tmp); color: var(--tmp-ink); }
.intro-rules { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .6rem; }
.intro-rules li { background: var(--paper-2); border: 3px solid var(--ink); border-radius: 12px; padding: .45em .85em; font-size: .95rem; }
.intro-actions { display: flex; justify-content: flex-end; }

/* jogada */
.play { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.timer { display: flex; align-items: center; gap: .8rem; }
.timer-track { flex: 1; height: 1.15rem; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; }
.timer-fill { height: 100%; background: var(--ok); transform-origin: left center; }
.timer.hurry .timer-fill { background: var(--bad); }
.timer-num {
  width: 2.9rem; height: 2.9rem; flex: none; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 1.45rem; font-variant-numeric: tabular-nums;
  color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 50%; box-shadow: 0 3px 0 var(--shadow);
}
.timer.hurry .timer-num { background: var(--bad-soft); animation: pulse .5s ease-in-out infinite; }

.p1-grid {
  flex: 1; display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr);
  grid-template-areas: "i card t";
  gap: clamp(12px, 2vw, 28px); min-height: 19rem;
}
#bin-I { grid-area: i; }
#bin-T { grid-area: t; }
.card-zone { grid-area: card; display: grid; place-items: center; min-width: 0; position: relative; }
.bin {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem;
  padding: 1rem .8rem; font-family: var(--font-display); font-size: clamp(1.3rem, 2.2vw, 2rem); line-height: 1;
  border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--shadow);
  transition: transform .15s, box-shadow .15s;
}
.bin svg { width: clamp(3rem, 6vw, 5rem); height: auto; }
.bin-int { background: var(--int); color: var(--int-ink); }
.bin-tmp { background: var(--tmp); color: var(--tmp-ink); }
.bin:hover:not(:disabled), .bin.hot { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 0 var(--shadow), 0 0 0 6px var(--sun); }
.bin:disabled { cursor: default; }
.bin.right { box-shadow: 0 8px 0 var(--shadow), 0 0 0 7px var(--ok); }
.bin.wrong { box-shadow: 0 8px 0 var(--shadow), 0 0 0 7px var(--bad); animation: shake .45s; }
.key-hint { font-family: var(--font-body); font-size: .8rem; font-weight: 900; border: 2px solid currentColor; border-radius: 8px; padding: .05em .5em; opacity: .85; }
.deal-card {
  position: relative; width: min(100%, 27rem); min-height: 15rem;
  display: flex; flex-direction: column; justify-content: center; gap: .9rem;
  padding: 1.4rem 1.5rem; color: var(--ink); background: var(--paper);
  border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 10px 0 var(--shadow);
  transform: rotate(-2deg); transition: transform .25s;
  animation: deal .5s cubic-bezier(.2, .9, .3, 1.25) backwards;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
}
.deal-card.dragging { cursor: grabbing; transition: none; animation: none; box-shadow: 0 18px 0 var(--shadow); }
.deal-card.fly { transition: transform .36s cubic-bezier(.5, 0, .75, 0), opacity .36s ease-in; opacity: 0; }
.deal-card.gone { animation: shake .4s; opacity: 0; transition: opacity .35s .3s; }
.deal-kicker { font-size: .8rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.deal-text { margin: 0; font-family: var(--font-display); font-size: clamp(1.45rem, 2.3vw, 2.15rem); line-height: 1.12; text-wrap: balance; }
.deal-hint { font-size: .85rem; color: var(--ink-soft); }

.verdict {
  width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .8rem 1.2rem; align-items: center;
  color: var(--ink); background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
  box-shadow: 0 8px 0 var(--shadow); padding: 1rem 1.3rem;
  animation: pop .4s cubic-bezier(.2, .9, .3, 1.25) backwards;
}
.verdict.ok { background: var(--ok-soft); }
.verdict.bad { background: var(--bad-soft); }
.verdict-mascot .mascot { width: clamp(3.6rem, 6vw, 5rem); height: auto; display: block; }
.verdict-body { min-width: 0; display: grid; gap: .35rem; }
.verdict-title { margin: 0; font-family: var(--font-display); font-size: clamp(1.5rem, 2.4vw, 2.1rem); line-height: 1; }
.verdict.ok .verdict-title { color: var(--ok); }
.verdict.bad .verdict-title { color: var(--bad); }
.verdict-answer { margin: 0; font-weight: 800; }
.verdict-text { margin: 0; font-size: 1.05rem; line-height: 1.42; max-width: 68ch; }
.verdict-side { display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; }
.verdict-gain { margin: 0; display: flex; align-items: baseline; gap: .3rem; font-family: var(--font-display); font-size: 2.2rem; line-height: 1; }
.verdict-gain span { font-family: var(--font-body); font-size: .85rem; font-weight: 900; }
.verdict.compact { grid-template-columns: auto minmax(0, 1fr); }
.verdict.compact .verdict-side { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; }

.case-card, .company {
  color: var(--ink); background: var(--paper);
  border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--shadow);
  padding: clamp(14px, 1.6vw, 24px) clamp(16px, 2vw, 28px);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(12px, 2vw, 26px); align-items: center;
  animation: pop .4s cubic-bezier(.2, .9, .3, 1.25) backwards;
}
.case-who { display: flex; flex-direction: column; align-items: center; gap: .4rem; width: 6.5rem; }
.avatar { width: 5.6rem; height: 5.6rem; border-radius: 50%; overflow: hidden; background: var(--paper-2); border: 4px solid var(--ink); }
.avatar svg { width: 100%; height: 100%; display: block; }
.place-art svg { width: 6rem; height: auto; display: block; }
.who-name { font-size: .85rem; font-weight: 900; text-align: center; color: var(--paper); background: var(--ink); border-radius: 999px; padding: .15em .7em; }
.case-ctx { margin: 0; font-size: 1.15rem; line-height: 1.42; color: var(--ink-soft); }
.case-q { margin: .35rem 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.5rem, 2.3vw, 2.15rem); line-height: 1.12; text-wrap: balance; }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem; }
.options.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt {
  display: flex; align-items: center; gap: .8rem; min-height: 4.2rem; text-align: left;
  font-size: 1.1rem; font-weight: 800; line-height: 1.25;
  color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 5px 0 var(--shadow); padding: .75rem 1rem;
  transition: transform .1s, box-shadow .1s, opacity .2s;
}
.opt:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--shadow); }
.opt:disabled { cursor: default; }
.opt-key {
  flex: none; width: 2.2rem; height: 2.2rem; display: grid; place-items: center;

}
.opt.is-right { background: var(--ok-soft); box-shadow: 0 5px 0 var(--shadow), 0 0 0 5px var(--ok); }
.opt.is-right .opt-key { background: var(--ok); color: var(--on-strong); }
.opt.is-wrong { background: var(--bad-soft); box-shadow: 0 5px 0 var(--shadow), 0 0 0 5px var(--bad); animation: shake .45s; }
.opt.is-wrong .opt-key { background: var(--bad); color: var(--on-strong); }
.opt.is-dim { opacity: .5; }

.company { position: relative; }
.company-art svg { width: clamp(4.5rem, 8vw, 7rem); height: auto; display: block; }
.company-kicker { margin: 0; font-size: .78rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.company-name { margin: .15rem 0 .35rem; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 2.6vw, 2.3rem); line-height: 1.05; }
.company-sit { margin: 0; font-size: 1.1rem; line-height: 1.42; max-width: 70ch; }
.stamp {
  position: absolute; top: -1rem; right: clamp(10px, 2vw, 26px);
  font-family: var(--font-display); font-size: clamp(1.3rem, 2.3vw, 2rem); line-height: 1; letter-spacing: .04em; text-transform: uppercase;
  color: var(--bad); background: var(--paper); border: 5px solid currentColor; border-radius: 12px; padding: .2em .55em;
  transform: rotate(-8deg); pointer-events: none;
  animation: stamp .45s cubic-bezier(.2, .9, .3, 1.2) backwards;
}
.stamp.ok { color: var(--ok); }
.p3-step { display: grid; gap: .8rem; }
.p3-step.enter { animation: enter .35s ease-out backwards; }
.step-q {
  margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: .3rem .7rem;
  font-family: var(--font-display); font-weight: 400; font-size: clamp(1.35rem, 2.2vw, 1.9rem); line-height: 1.15; color: var(--on-bg);
}
.step-tag {
  font-family: var(--font-body); font-size: .75rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;

}
.step-note { margin: 0; font-weight: 800; color: var(--on-bg); }
.reg-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.reg-btn {
  display: flex; align-items: center; justify-content: center; gap: .8rem; padding: .85rem 1rem;
  font-family: var(--font-display); font-size: clamp(1.3rem, 2.3vw, 1.9rem);

  transition: transform .12s, box-shadow .12s, opacity .2s;
}
.reg-btn svg { width: clamp(2.4rem, 4vw, 3.2rem); height: auto; flex: none; }
.reg-int { background: var(--int); color: var(--int-ink); }
.reg-tmp { background: var(--tmp); color: var(--tmp-ink); }
.reg-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 0 var(--shadow); }
.reg-btn:disabled { cursor: default; }
.reg-btn.is-right { box-shadow: 0 7px 0 var(--shadow), 0 0 0 7px var(--ok); }
.reg-btn.is-wrong { box-shadow: 0 7px 0 var(--shadow), 0 0 0 7px var(--bad); animation: shake .45s; }
.reg-btn.is-dim { opacity: .45; }

/* fim de fase e fim de jogo */
.phase-end { width: 100%; max-width: 54rem; margin: 0 auto; display: grid; gap: 1.2rem; }
.pe-head { display: flex; align-items: center; gap: 1rem; }
.pe-head .mascot { width: clamp(4rem, 7vw, 6rem); height: auto; flex: none; }
.pe-title { margin: .35rem 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 4vw, 3rem); line-height: 1; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: .8rem; }
.bar-row { display: grid; grid-template-columns: 2.6rem minmax(5rem, 11rem) minmax(0, 1fr) auto; gap: .8rem; align-items: center; }
.bar-pos { font-family: var(--font-display); font-size: 1.6rem; }
.bar-name { font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }

.bar-fill { display: block; height: 100%; width: 0; background: var(--team); border-right: 3px solid var(--ink); transition: width 1s cubic-bezier(.2, .9, .3, 1.05); }
.bar-fill.grow { width: var(--w); }
.bar-score { display: grid; justify-items: end; font-family: var(--font-display); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.bar-score small { font-family: var(--font-body); font-size: .72rem; font-weight: 900; color: var(--ink-soft); }
.pe-actions { display: flex; justify-content: flex-end; }

.final { width: 100%; max-width: 66rem; margin: 0 auto; display: grid; gap: clamp(16px, 2.4vw, 28px); }
.final-head { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 1rem; text-align: center; }
.final-head .mascot { width: clamp(4.5rem, 8vw, 7rem); height: auto; animation: bob 2s ease-in-out infinite; }
.final-titles { display: grid; justify-items: center; gap: .3rem; }
.final-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4.6rem); line-height: 1; text-wrap: balance; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2vw, 22px); }
.pod { display: flex; flex-direction: column; align-items: center; gap: .35rem; width: min(12rem, 23%); min-width: 0; }
.crown svg { width: 3.4rem; height: auto; display: block; }
.pod-name { font-weight: 900; font-size: 1.05rem; line-height: 1.15; text-align: center; color: var(--on-bg); overflow-wrap: anywhere; }
.pod-score { font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2.1rem); line-height: 1; color: var(--on-bg); font-variant-numeric: tabular-nums; }
.pod-block {
  width: 100%; height: var(--h); display: grid; justify-items: center; align-content: start; padding-top: .5rem;

  background: var(--team); border: 4px solid var(--ink); border-radius: 16px 16px 6px 6px; box-shadow: 0 8px 0 var(--shadow);

}
.final-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: .8rem; }
.summary { display: grid; gap: .8rem; }
.summary .panel-title { margin: 0; }
.table-wrap { overflow-x: auto; border: 3px solid var(--ink); border-radius: 16px; }
.summary table { width: 100%; min-width: 34rem; border-collapse: collapse; font-size: .98rem; }
.summary th, .summary td { padding: .7rem .9rem; text-align: left; vertical-align: top; line-height: 1.38; border-bottom: 2px solid var(--paper-2); }
.summary thead th { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; border-bottom: 3px solid var(--ink); }
.summary thead th.int { background: var(--int); color: var(--int-ink); }
.summary thead th.tmp { background: var(--tmp); color: var(--tmp-ink); }
.summary tbody th { width: 20%; font-weight: 900; color: var(--ink-soft); }
.summary tr.common td { background: var(--ok-soft); font-weight: 900; text-align: center; }
.summary tbody tr:last-child > * { border-bottom: 0; }

/* sobreposições */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.overlay-card {
  width: min(100%, 30rem); display: grid; gap: .8rem; justify-items: center; text-align: center;
  color: var(--ink); background: var(--paper); border: 4px solid var(--ink); border-radius: 24px;
  box-shadow: 0 8px 0 var(--shadow); padding: clamp(18px, 3vw, 32px);
  animation: pop .3s ease-out backwards;
}
.overlay-card p { margin: 0; line-height: 1.45; }
.overlay-title { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; }
.overlay-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem; }
#banner { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; overflow: hidden; pointer-events: none; }
.banner-inner {
  width: 130%; display: flex; flex-direction: column; align-items: center; gap: .2rem;
  padding: clamp(14px, 3vh, 30px) 0; color: var(--ink); background: var(--team);
  border-block: 6px solid var(--ink); box-shadow: 0 10px 0 var(--shadow);
  transform: translateX(-110%) skewY(-4deg);
}
#banner.run .banner-inner { animation: banner 1.25s cubic-bezier(.2, .8, .2, 1) forwards; }
.banner-kicker { font-size: clamp(.9rem, 1.6vw, 1.2rem); font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
.banner-name { font-family: var(--font-display); font-size: clamp(2.6rem, 8vw, 6rem); line-height: 1; text-align: center; padding-inline: 16px; }

@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes enter { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } to { transform: scale(1); opacity: 1; } }
@keyframes deal { from { transform: translateY(-50px) rotate(-14deg) scale(.7); opacity: 0; } to { transform: rotate(-2deg); opacity: 1; } }
@keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -10px 0; } 40% { translate: 9px 0; } 60% { translate: -6px 0; } 80% { translate: 4px 0; } }
@keyframes floatUp { from { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { transform: translate(-50%, -8px) scale(1.1); opacity: 1; } to { transform: translate(-50%, -58px) scale(1); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
@keyframes banner { 0% { transform: translateX(-110%) skewY(-4deg); } 22%, 78% { transform: translateX(0) skewY(-4deg); } 100% { transform: translateX(110%) skewY(-4deg); } }
@keyframes stamp { from { transform: scale(2.6) rotate(-16deg); opacity: 0; } 65% { transform: scale(.94) rotate(-8deg); opacity: 1; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }
@keyframes pulse { 0%, 100% { scale: 1; } 50% { scale: 1.1; } }
@keyframes bump { 0% { scale: 1; } 40% { scale: 1.08; } 100% { scale: 1; } }
@keyframes rise { from { transform: scaleY(0); } }

@media (max-width: 860px) {
  .setup-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .primer { grid-template-columns: minmax(0, 1fr); }
  .intro-head { grid-template-columns: minmax(0, 1fr); }
  .intro-mascot { display: none; }
  .intro-actions .btn { width: 100%; }
  .p1-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "card card" "i t"; min-height: 0; }
  .bin { padding: .8rem .6rem; }
  .deal-card { min-height: 11rem; }
  .verdict { grid-template-columns: auto minmax(0, 1fr); }
  .verdict-side { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .options, .options.n3 { grid-template-columns: minmax(0, 1fr); }
  .case-card, .company { grid-template-columns: minmax(0, 1fr); }
  .case-who { flex-direction: row; width: auto; }
  .avatar { width: 3.6rem; height: 3.6rem; }
  .place-art svg { width: 3.8rem; }
  .company-art { display: none; }
}
@media (max-width: 640px) {
  .scorebar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bar-row { grid-template-columns: 2rem minmax(0, 1fr) auto; }
  .bar-track { grid-column: 1 / -1; }
  .tools { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .rays { animation: none; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  #banner.run .banner-inner { animation: none !important; transform: skewY(-4deg); }
}
</style>

</head>
<body>
<div class="rays" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <header class="topbar" id="topbar" hidden>
    <span class="mini-logo outlined-sm">Contrato em Jogo</span>
    <nav class="phase-pills" id="phase-pills" aria-label="Fases"></nav>
    <span class="progress" id="progress" aria-live="polite"></span>

</div>

<div class="overlay" id="pause" hidden>

  </div>
</div>
<div class="overlay" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="overlay-card">
    <p class="overlay-title" id="confirm-title">Encerrar a partida?</p>
    <p>O placar atual será perdido e o jogo volta para a montagem dos times.</p>
    <div class="overlay-actions">
      <button class="btn" type="button" data-act="quitNo" id="quit-no">Continuar jogando</button>

</div>

  const pillHTML = r => `<span class="pill ${r === 'I' ? 'pill-int' : 'pill-tmp'}">${REG[r]}</span>`;

  /* cronômetro */
  const T = { total: 0, left: 0, last: 0, raf: 0, running: false, onEnd: null, lastSec: 0 };
  function startTimer(sec, onEnd) {
    stopTimer();
    T.total = T.left = sec * 1000;
    T.onEnd = onEnd;
    T.running = true;
    T.last = performance.now();
    T.lastSec = sec;
    renderTimer();
    T.raf = requestAnimationFrame(tick);
  }
  function tick(now) {
    if (!T.running) return;
    const dt = Math.min(100, Math.max(0, now - T.last));
    T.last = now;
    if (!S.paused) T.left -= dt;
    const s = Math.ceil(T.left / 1000);
    if (s < T.lastSec && s <= 5 && s > 0) SFX.tick();
    T.lastSec = s;
    if (T.left <= 0) {
      T.left = 0;
      T.running = false;
      renderTimer();
      const cb = T.onEnd;
      T.onEnd = null;
      if (cb) cb();
      return;
    }
    renderTimer();
    T.raf = requestAnimationFrame(tick);
  }
  function stopTimer() {
    T.running = false;
    cancelAnimationFrame(T.raf);
    return T.total ? Math.max(0, T.left / T.total) : 0;
  }
  function renderTimer() {
    const fill = document.getElementById('timer-fill');
    if (!fill) return;
    const k = T.total ? Math.max(0, T.left / T.total) : 0;
    fill.style.transform = `scaleX(${k})`;
    const s = Math.max(0, Math.ceil(T.left / 1000));
    const num = document.getElementById('timer-num');
    if (num && num.textContent !== String(s)) num.textContent = s;
    const box = document.getElementById('timer');
    if (box) box.classList.toggle('hurry', s <= 5);
  }
  const timerHTML = () => `<div class="timer" id="timer"><div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div><span class="timer-num" id="timer-num" aria-label="segundos restantes">${PHASES[S.phase].time}</span></div>`;

  function scoreFor(p, frac) {
    return Math.round((PHASES[p].base + PHASES[p].bonus * frac) / 5) * 5;
  }

  /* estrutura do jogo */
  function withShuffledOptions(q) {
    const order = shuffle(q.opts.map((_, i) => i));
    return Object.assign({}, q, { opts: order.map(i => q.opts[i]), correct: order.indexOf(0) });
  }
  function balancedPick(pool, key, total) {
    const a = shuffle(pool.filter(x => x[key] === 'I')), b = shuffle(pool.filter(x => x[key] === 'T'));
    const nA = Math.random() < .5 ? Math.floor(total / 2) : Math.ceil(total / 2);
    return shuffle(a.slice(0, nA).concat(b.slice(0, total - nA)));
  }
  function buildPhaseQueue(p, n) {
    const total = PLAN[n][p] * n;
    let items;
    if (p === 0) items = balancedPick(P1, 'a', total);
    else if (p === 1) items = shuffle(P2).slice(0, total).map(withShuffledOptions);
    else items = balancedPick(P3, 'r', total).map(withShuffledOptions);
    const start = p % n;
    return items.map((item, j) => ({ item, team: (start + j) % n }));
  }

  function rankTeams() {
    const list = S.teams.map((t, i) => ({ t, i })).sort((a, b) => b.t.score - a.t.score);
    list.forEach((r, k) => { r.pos = k > 0 && r.t.score === list[k - 1].t.score ? list[k - 1].pos : k + 1; });
    return list;
  }

  function renderChrome() {
    const done = i => S.mode === 'final' || i < S.phase || (i === S.phase && S.mode === 'phaseEnd');
    document.getElementById('phase-pills').innerHTML = PHASES.map((ph, i) =>
      `<span class="pill-step ${done(i) ? 'done' : ''} ${i === S.phase && !done(i) ? 'now' : ''}">${i + 1} · ${ph.short}</span>`).join('');
    document.getElementById('progress').textContent = PLAYING.includes(S.mode) ? `Desafio ${S.idx + 1} de ${S.queue.length}` : '';
    const pb = document.getElementById('pause-btn');

    S.teams.forEach((_, i) => {
      const chip = document.getElementById('chip-' + i);

  function countUp(el, a, b) {
    const t0 = performance.now(), d = 700;
    const step = now => {
      const k = Math.min(1, (now - t0) / d);
      el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);

    requestAnimationFrame(step);
  }

  function binAt(x, y, dx) {

      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return k;
    }
    const th = Math.min(160, innerWidth * .18);
    if (dx <= -th) return 'I';
    if (dx >= th) return 'T';
    return null;
  }
  function setupDrag() {
    const card = document.getElementById('deal-card');
    if (!card) return;
    let sx = 0, sy = 0, dragging = false, pid = null;
    card.addEventListener('pointerdown', e => {
      if (S.mode !== 'play' || S.paused || S.answered) return;
      dragging = true;
      pid = e.pointerId;
      sx = e.clientX;
      sy = e.clientY;
      try { card.setPointerCapture(pid); } catch (err) {}
      card.classList.add('dragging');
    });
    card.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 14}deg)`;
      markBins(binAt(e.clientX, e.clientY, dx));
    });
    const end = e => {
      if (!dragging) return;
      dragging = false;
      try { card.releasePointerCapture(pid); } catch (err) {}
      const hit = e.type === 'pointerup' ? binAt(e.clientX, e.clientY, e.clientX - sx) : null;
      markBins(null);
      if (hit && S.mode === 'play' && !S.answered && !S.paused) answerP1(hit);
      else {
        card.classList.remove('dragging');
        card.style.transform = '';
      }
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
  }
  function answerP1(v) {
    if (S.mode !== 'play' || S.answered || S.paused || S.phase !== 0) return;
    S.answered = true;
    const frac = stopTimer();
    const turn = S.queue[S.idx], it = turn.item;
    const ok = v === it.a;
    const card = document.getElementById('deal-card');
    const bin = document.getElementById('bin-' + v);
    const zone = document.getElementById('card-zone');
    if (card && bin && zone) {
      const zr = zone.getBoundingClientRect(), br = bin.getBoundingClientRect();
      const dx = br.left + br.width / 2 - (zr.left + zr.width / 2);
      const dy = br.top + br.height / 2 - (zr.top + zr.height / 2);
      card.classList.remove('dragging');
      card.classList.add('fly');
      card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx < 0 ? -20 : 20}deg) scale(.25)`;
    }
    markBinResult(v, it.a);
    const gain = ok ? scoreFor(0, frac) : 0;
    if (ok) { SFX.ok(); addScore(turn.team, gain); burstAt(bin); }
    else SFX.bad();
    S.mode = 'feedback';
    setTimeout(() => putVerdict({ ok, timeout: false, gain, answerHTML: `Resposta: ${pillHTML(it.a)}`, text: it.e, primaryLabel: nextLabel(), compact: true }, 'card-zone'), REDUCED ? 0 : 380);
  }
  function timeoutP1() {
    S.answered = true;
    const it = S.queue[S.idx].item;
    const card = document.getElementById('deal-card');
    if (card) card.classList.add('gone');
    markBinResult(null, it.a);
    S.mode = 'feedback';
    setTimeout(() => putVerdict({ ok: false, timeout: true, gain: 0, answerHTML: `Resposta: ${pillHTML(it.a)}`, text: it.e, primaryLabel: nextLabel(), compact: true }, 'card-zone'), REDUCED ? 0 : 450);
  }

  /* fase 2 */
  function whoHTML(it) {
    if (it.who) return `<div class="avatar">${avatar(it.who)}</div><span class="who-name">${esc(it.who.name)}</span>`;
    if (it.place) return `<div class="place-art">${it.place.kind === 'predio' ? svgBuilding(it.place.cor) : svgStore(it.place.cor)}</div><span class="who-name">${esc(it.place.name)}</span>`;
    return `<div class="place-art">${mascot('think')}</div><span class="who-name">A turma</span>`;
  }
  function renderP2() {
    const it = S.queue[S.idx].item;
    stage.innerHTML = `
    <div class="play p2">
      ${timerHTML()}
      <article class="case-card">
        <div class="case-who">${whoHTML(it)}</div>
        <div class="case-body">
          <p class="case-ctx">${esc(it.ctx)}</p>
          <h2 class="case-q">${esc(it.q)}</h2>
        </div>
      </article>
      <div class="options n${it.opts.length}" role="group" aria-label="Alternativas">${optionsHTML(it.opts)}</div>
      <div id="verdict-slot"></div>
    </div>`;
  }
  function answerOpt(i) {
    if (S.mode !== 'play' || S.answered || S.paused) return;
    if (S.phase === 1) revealP2(i);
    else if (S.phase === 2 && S.step === 2) revealP3Step2(i);
  }
  function revealP2(i) {
    S.answered = true;
    const frac = stopTimer();
    const turn = S.queue[S.idx], it = turn.item;
    const ok = i === it.correct;
    markOptions(i, it.correct);
    const gain = ok ? scoreFor(1, frac) : 0;
    if (ok) { SFX.ok(); addScore(turn.team, gain); burstAt(document.getElementById('opt-' + i)); }
    else if (i !== null) SFX.bad();
    S.mode = 'feedback';
    putVerdict({ ok, timeout: i === null, gain, answerHTML: `Resposta certa: <b>${LETTERS[it.correct]}</b>`, text: it.e, primaryLabel: nextLabel() });
  }

  /* fase 3 */
  function renderP3() {
    const it = S.queue[S.idx].item;
    stage.innerHTML = `
    <div class="play p3">
      ${timerHTML()}
      <article class="company">
        <div class="company-art">${it.place === 'predio' ? svgBuilding(it.cor) : svgStore(it.cor)}</div>
        <div class="company-body">
          <p class="company-kicker">Você é o RH desta empresa</p>
          <h2 class="company-name">${esc(it.nome)}</h2>
          <p class="company-sit">${esc(it.sit)}</p>
        </div>
      </article>
      <div class="p3-step enter" id="p3-step">
        <h3 class="step-q"><span class="step-tag">Decisão 1</span>Qual regime se encaixa melhor?</h3>
        <div class="reg-choice">
          <button class="reg-btn reg-int" type="button" data-act="p3reg" data-v="I" id="reg-I">${svgPhone()}<span>Intermitente</span><span class="key-hint" aria-hidden="true">←</span></button>
          <button class="reg-btn reg-tmp" type="button" data-act="p3reg" data-v="T" id="reg-T">${svgHourglass()}<span>Temporário</span><span class="key-hint" aria-hidden="true">→</span></button>
        </div>
        <div id="verdict-slot"></div>
      </div>
    </div>`;
  }
  function answerP3Reg(v) {
    if (S.mode !== 'play' || S.answered || S.paused || S.phase !== 2 || S.step !== 1) return;
    revealP3Step1(v);
  }
  function revealP3Step1(v) {
    S.answered = true;
    const frac = stopTimer();
    const turn = S.queue[S.idx], it = turn.item;
    const ok = v === it.r;
    ['I', 'T'].forEach(k => {
      const b = document.getElementById('reg-' + k);
      if (!b) return;
      b.disabled = true;
      if (k === it.r) b.classList.add('is-right');
      else if (k === v) b.classList.add('is-wrong');
      else b.classList.add('is-dim');
    });
    const gain = ok ? scoreFor(2, frac) : 0;
    if (ok) { SFX.ok(); addScore(turn.team, gain); burstAt(document.getElementById('reg-' + v)); }
    else if (v) SFX.bad();
    S.mode = 'feedback1';
    putVerdict({ ok, timeout: !v, gain, answerHTML: `Regime que se encaixa: ${pillHTML(it.r)}`, text: it.e1, primaryLabel: 'Ir para a decisão 2', act: 'p3next' });
  }
  function startP3Step2() {
    if (S.mode !== 'feedback1') return;
    const it = S.queue[S.idx].item;
    const box = document.getElementById('p3-step');
    if (!box) return;
    S.step = 2;
    S.answered = false;
    S.mode = 'play';
    box.innerHTML = `
      <h3 class="step-q"><span class="step-tag">Decisão 2</span>${esc(it.q2)}</h3>
      <p class="step-note">Regime desta empresa: ${pillHTML(it.r)}</p>
      <div class="options n${it.opts.length}" role="group" aria-label="Alternativas">${optionsHTML(it.opts)}</div>
      <div id="verdict-slot"></div>`;
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
    renderChrome();
    startTimer(PHASES[2].time, onTimeout);
  }
  function revealP3Step2(i) {
    S.answered = true;
    const frac = stopTimer();
    const turn = S.queue[S.idx], it = turn.item;
    const ok = i === it.correct;
    markOptions(i, it.correct);
    const gain = ok ? scoreFor(2, frac) : 0;
    if (ok) { SFX.ok(); addScore(turn.team, gain); burstAt(document.getElementById('opt-' + i)); }
    else if (i !== null) SFX.bad();
    setTimeout(() => SFX.stamp(), 140);
    const comp = stage.querySelector('.company');
    if (comp) {
      const st = document.createElement('div');
      st.className = 'stamp ' + (ok ? 'ok' : 'bad');
      st.textContent = ok ? 'Regular' : 'Irregular';
      comp.appendChild(st);
    }
    S.mode = 'feedback';
    putVerdict({ ok, timeout: i === null, gain, answerHTML: `Resposta certa: <b>${LETTERS[it.correct]}</b>`, text: it.e2, primaryLabel: nextLabel() });
  }

  /* placares */
  function showPhaseEnd() {
    stopTimer();
    S.mode = 'phaseEnd';
    const ranking = rankTeams();
    const max = Math.max(1, ...S.teams.map(t => t.score));
    stage.innerHTML = `
    <section class="panel phase-end">
      <div class="pe-head">
        ${mascot('happy')}
        <div>
          <span class="phase-badge">Fim da fase ${S.phase + 1}</span>
          <h2 class="pe-title">Placar parcial</h2>
        </div>
      </div>
      <ol class="bars">
        ${ranking.map(r => `
          <li class="bar-row">
            <span class="bar-pos">${r.pos}º</span>
            <span class="bar-name">${esc(r.t.name)}</span>
            <span class="bar-track"><span class="bar-fill" style="--team:${r.t.color}; --w:${(r.t.score / max * 100).toFixed(1)}%"></span></span>
            <span class="bar-score">${r.t.score}<small>+${r.t.score - (S.phaseStartScores[r.i] || 0)} nesta fase</small></span>
          </li>`).join('')}
      </ol>
      <div class="pe-actions">
        <button class="btn btn-primary btn-big" type="button" data-act="nextPhase" data-primary>Ir para a fase ${S.phase + 2}: ${PHASES[S.phase + 1].short} <span class="btn-key">espaço</span></button>
      </div>
    </section>`;
    renderChrome();
    SFX.go();
    requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.bar-fill').forEach(el => el.classList.add('grow'))));
    focusPrimary();
  }
  function showFinal() {
    stopTimer();
    S.mode = 'final';
    const ranking = rankTeams();
    const winners = ranking.filter(r => r.pos === 1);
    const title = winners.length > 1 ? 'Empate no topo!' : `${winners[0].t.name} venceu!`;
    const order = [1, 0, 2, 3].filter(i => i < ranking.length).map(i => ranking[i]);
    const H = { 1: 11, 2: 8, 3: 5.8, 4: 4.2 };
    stage.innerHTML = `
    <section class="final">
      <div class="final-head">
        ${mascot('wow')}
        <div class="final-titles">
          <span class="kicker">Fim de jogo</span>
          <h2 class="final-title outlined">${esc(title)}</h2>
        </div>
      </div>
      <div class="podium">
        ${order.map((r, k) => `
          <div class="pod">
            ${r.pos === 1 ? `<span class="crown">${svgCrown()}</span>` : ''}
            <span class="pod-name">${esc(r.t.name)}</span>
            <span class="pod-score">${r.t.score}</span>
            <div class="pod-block" style="--team:${r.t.color}; --h:${H[r.pos]}rem; animation-delay:${k * 120}ms">${r.pos}º</div>
          </div>`).join('')}
      </div>
      <div class="final-actions">
        <button class="btn btn-primary btn-big" type="button" data-act="again" data-primary>Jogar de novo com os mesmos times</button>
        <button class="btn btn-big" type="button" data-act="toSetup">Trocar os times</button>
      </div>
      <section class="panel summary">
        <h3 class="panel-title">Resumo para a turma</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th scope="col"><span class="sr-only">Aspecto</span></th><th scope="col" class="int">Intermitente</th><th scope="col" class="tmp">Temporário</th></tr></thead>
            <tbody>
              ${RESUMO.map(([k, a, b]) => `<tr><th scope="row">${esc(k)}</th><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}
              <tr class="common"><th scope="row">Em comum</th><td colspan="2">Os dois são empregos formais: carteira assinada, FGTS e INSS.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>`;
    renderChrome();
    SFX.fanfare();
    bigConfetti();
    focusPrimary();
  }

  /* pausa e encerrar */
  function togglePause(force) {
    if (S.mode !== 'play') return;
    S.paused = typeof force === 'boolean' ? force : !S.paused;
    document.getElementById('pause').hidden = !S.paused;
    renderChrome();
  }
  function openConfirm() {
    S.resumeBanner = false;
    if (S.mode === 'banner') {
      clearTimeout(S.bannerT);
      const b = document.getElementById('banner');
      b.hidden = true;
      b.classList.remove('run');
      S.resumeBanner = true;
    }
    S.wasPaused = S.paused;
    if (S.mode === 'play') S.paused = true;
    document.getElementById('confirm').hidden = false;
    document.getElementById('quit-no').focus();
  }
  function closeConfirm(quit) {
    document.getElementById('confirm').hidden = true;
    if (quit) {
      S.paused = false;
      S.resumeBanner = false;
      return;
    }
    S.paused = S.wasPaused;
    if (S.resumeBanner) {
      S.resumeBanner = false;
      startChallenge();
    }
  }

  /* ações */
  const ACT = {
    nteams: el => { S.nTeams = +el.dataset.n; updateSetupTeams(); savePrefs(); },
    sound: () => { S.sound = !S.sound; savePrefs(); updateSoundButtons(); if (S.sound) SFX.go(); },
    fs: () => toggleFS(),
    beginPhase: () => { if (S.mode === 'intro') startChallenge(); },
    p1: el => answerP1(el.dataset.v),
    opt: el => answerOpt(+el.dataset.i),
    p3reg: el => answerP3Reg(el.dataset.v),
    p3next: () => startP3Step2(),
    next: () => next(),
    nextPhase: () => { if (S.mode === 'phaseEnd' && S.phase < 2) { S.phase++; showPhaseIntro(); } },
    again: () => { S.teams.forEach(t => { t.score = 0; }); buildScorebar(); S.phase = 0; showPhaseIntro(); },
    toSetup: () => renderSetup(),
    pause: () => togglePause(),
    resume: () => togglePause(false),
    quit: () => openConfirm(),
    quitYes: () => { closeConfirm(true); renderSetup(); },
    quitNo: () => closeConfirm(false),
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    fn(el);
  });
  document.addEventListener('submit', e => {
    if (e.target && e.target.id === 'setup-form') {
      e.preventDefault();
      startGame();
    }
  });
  document.addEventListener('keydown', e => {
    const k = e.key;
    const tag = e.target && e.target.tagName;
    if (!document.getElementById('confirm').hidden) {
      if (k === 'Escape') { e.preventDefault(); closeConfirm(false); }
      return;
    }
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (S.mode === 'setup' || e.ctrlKey || e.metaKey || e.altKey) return;
    if ((k === 'p' || k === 'P') && S.mode === 'play') { e.preventDefault(); togglePause(); return; }
    if (S.paused) {
      if (k === ' ' || k === 'Enter') { e.preventDefault(); togglePause(false); }
      return;
    }
    if (S.mode === 'play') {
      if (tag === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
      if (S.phase === 0 || (S.phase === 2 && S.step === 1)) {
        const v = (k === 'ArrowLeft' || k === '1') ? 'I' : (k === 'ArrowRight' || k === '2') ? 'T' : null;
        if (v) {
          e.preventDefault();
          if (S.phase === 0) answerP1(v); else answerP3Reg(v);
        }
        return;
      }
      const idx = KEYMAP[k.toLowerCase()];
      if (idx !== undefined) {
        const b = document.getElementById('opt-' + idx);
        if (b && !b.disabled) { e.preventDefault(); answerOpt(idx); }
      }
      return;
    }
    if ((k === ' ' || k === 'Enter') && ['intro', 'feedback', 'feedback1', 'phaseEnd', 'final'].includes(S.mode)) {
      e.preventDefault();
      const b = stage.querySelector('[data-primary]');
      if (b && !b.disabled) b.click();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.mode === 'play' && !S.paused) togglePause(true);
  });
  document.addEventListener('fullscreenchange', updateFsButtons);

  /* atualização ao vivo e início */
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') {
      hot.snapshot(() => ({ S: { mode: S.mode, teams: S.teams, phase: S.phase, queue: S.queue, idx: S.idx, phaseStartScores: S.phaseStartScores } }));
    }
  } catch (e) {}

  function boot(data) {
    loadPrefs();
    updateSoundButtons();
    updateFsButtons();
    const d = data && data.S;
    if (d && Array.isArray(d.teams) && d.teams.length >= 2 && d.mode && d.mode !== 'setup') {
      S.teams = d.teams;
      S.nTeams = d.teams.length;
      S.phase = Math.min(2, Math.max(0, d.phase || 0));
      S.queue = Array.isArray(d.queue) ? d.queue : [];
      S.idx = d.idx || 0;
      S.phaseStartScores = d.phaseStartScores || d.teams.map(t => t.score);
      buildScorebar();
      showChrome(true);
      if (d.mode === 'final') showFinal();
      else if (d.mode === 'phaseEnd') showPhaseEnd();
      else if (d.mode === 'intro' || !S.queue[S.idx]) showPhaseIntro();
      else if (d.mode === 'feedback' || d.mode === 'feedback1') { S.mode = 'feedback'; next(); }
      else startChallenge();
      return;
    }
    renderSetup();
  }

  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
